<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원 관리 | 이세영 포트폴리오</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/templatemo-first-portfolio-style.css}" rel="stylesheet">
    <style>
        body { background: var(--section-bg-color); padding: 50px 16px; }
        .box { max-width: 860px; margin: 0 auto; background: var(--white-color); border-radius: var(--border-radius-medium); padding: 40px; box-shadow: 0 1rem 3rem rgba(0,0,0,.08); }
        .box h1 { font-size: 34px; margin-bottom: 24px; }
        .role-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #fff; background: var(--secondary-color); }
        .role-badge.ADMIN { background: #dc3545; } .role-badge.MANAGER { background: #f39c12; }
        .msg { border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 15px; }
        .msg.ok { background: #e6f7f1; color: #0e7a5a; } .msg.err { background: #fde8e8; color: #c0392b; }
        .links { margin-top: 24px; display: flex; gap: 10px; flex-wrap: wrap; }

    </style>
</head>
<body>
    <div class="box">
        <h1><i class="bi-people"></i> 회원 관리 <span class="role-badge ADMIN">ADMIN</span></h1>
        <!-- redirect 후 1번만 보이는 메시지 (flash) -->
        <div class="msg ok" th:if="${message}" th:text="${message}"></div>
        <div class="msg err" th:if="${error}" th:text="${error}"></div>
        <table class="table align-middle">
            <thead><tr><th>번호</th><th>아이디</th><th>이름</th><th>권한</th><th>권한 변경</th><th>삭제</th></tr></thead>
            <tbody>
                <tr th:each="m : ${members}">
                    <td th:text="${m.id}"></td>
                    <td><span th:text="${m.username}"></span> <small class="text-muted" th:if="${m.username == #authentication.name}">(나)</small></td>
                    <td th:text="${m.name}"></td>
                    <td><span class="role-badge" th:classappend="${m.role}" th:text="${m.role}"></span></td>
                    <td>
                        <!-- POST /admin/members/{id}/role, select name="role" → @RequestParam String role -->
                        <form th:action="@{/admin/members/{id}/role(id=${m.id})}" method="post" class="d-flex gap-2 m-0">
                            <select name="role" class="form-select form-select-sm" style="width:auto">
                                <option value="USER" th:selected="${m.role == 'USER'}">USER</option>
                                <option value="MANAGER" th:selected="${m.role == 'MANAGER'}">MANAGER</option>
                                <option value="ADMIN" th:selected="${m.role == 'ADMIN'}">ADMIN</option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-outline-primary">변경</button>
                        </form>
                    </td>
                    <td>
                        <form th:action="@{/admin/members/{id}/delete(id=${m.id})}" method="post" class="m-0" onsubmit="return confirm('정말 삭제할까요?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="links"><a th:href="@{/}" class="custom-btn btn">메인으로</a></div>
    </div>
</body>
</html>
