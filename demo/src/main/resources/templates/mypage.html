<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 정보 | 이세영 포트폴리오</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/templatemo-first-portfolio-style.css}" rel="stylesheet">
    <style>
        body { background: var(--section-bg-color); padding: 50px 16px; }
        .box { max-width: 860px; margin: 0 auto; background: var(--white-color); border-radius: var(--border-radius-medium); padding: 40px; box-shadow: 0 1rem 3rem rgba(0,0,0,.08); }
        .box h1 { font-size: 34px; margin-bottom: 24px; }
        .role-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #fff; background: var(--secondary-color); }
        .role-badge.ADMIN { background: #dc3545; } .role-badge.MANAGER { background: #f39c12; }
        .msg { border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 15px; }
        .msg.ok { background: #e6f7f1; color: #0e7a5a; } .msg.err { background: #fde8e8; color: #c0392b; }
        .links { margin-top: 24px; display: flex; gap: 10px; flex-wrap: wrap; }

    </style>
</head>
<body>
    <div class="box">
        <h1><i class="bi-person-circle"></i> 내 정보</h1>
        <table class="table">
            <tr><th style="width:160px">번호</th><td th:text="${member.id}"></td></tr>
            <tr><th>아이디</th><td th:text="${member.username}"></td></tr>
            <tr><th>이름</th><td th:text="${member.name}"></td></tr>
            <tr><th>권한 (DB)</th><td><span class="role-badge" th:classappend="${member.role}" th:text="${member.role}"></span></td></tr>
            <!-- 세션 권한 : 로그인하는 순간 복사된 값. DB 를 바꿔도 다시 로그인해야 반영 -->
            <tr><th>권한 (세션)</th><td sec:authentication="principal.authorities"></td></tr>
        </table>
        <p class="text-muted small">DB 권한과 세션 권한이 다르면 로그아웃 후 다시 로그인하세요.</p>
        <div class="links"><a th:href="@{/}" class="custom-btn btn">메인으로</a></div>
    </div>
</body>
</html>
